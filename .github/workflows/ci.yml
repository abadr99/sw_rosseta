name: CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ----------------------------- Linting -----------------------------

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - uses: actions/checkout@v4

      - name: Run Linter
        run: bash ./scripts/github/linux/lint.sh


  # ----------------------------- Building Linux -----------------------------

  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-ccache

      - name: Configure CMake (Linux)
        run: bash ./scripts/github/linux/config_build.sh

      - name: Build (Linux)
        run: bash ./scripts/github/linux/build.sh

      - name: Upload Linux build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-build-artifact
          path: |
            build-linux/tests/unit_tests
            build-linux/**/rosetta
          if-no-files-found: error
          retention-days: 1


  # ----------------------------- Testing Linux -----------------------------

  test-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build-linux

    steps:
      - uses: actions/checkout@v4

      - name: Download Linux test binary
        uses: actions/download-artifact@v4
        with:
          name: linux-build-artifact
          path: build-linux/

      - name: Configure Test Environment (Linux)
        run: bash ./scripts/github/linux/config_test.sh

      - name: Run Google Tests (Linux)
        run: bash ./scripts/github/linux/test.sh


  # ----------------------------- LIT Regression Linux -----------------------------

  regression-tests-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test-linux

    steps:
      - uses: actions/checkout@v4

      - name: Install Lit and GCC
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc python3-pip
          python3 -m pip install --user lit

      - name: Setup Vendored FileCheck
        run: |
          chmod +x third_party/llvm/FileCheck
          ./third_party/llvm/FileCheck --version

      - name: Download Linux build artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-build-artifact
          path: build-linux/

      - name: Locate and Setup Rosetta Binary
        run: |
          echo "Searching for rosetta..."
          ROSETTA_BIN=$(find build-linux -type f -name rosetta | head -n 1)

          if [ -z "$ROSETTA_BIN" ]; then
            echo "ERROR: rosetta binary was not found."
            find build-linux -type f | sort
            exit 1
          fi

          echo "Found rosetta at: $ROSETTA_BIN"
          mkdir -p build/dev
          cp "$ROSETTA_BIN" build/dev/rosetta
          chmod +x build/dev/rosetta
          ls -lh build/dev/rosetta

      - name: Run LIT Regression Suite
        run: lit -v scripts/Lit_Script


  # ----------------------------- Building Windows -----------------------------

  build-win:
    runs-on: windows-latest
    timeout-minutes: 15
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-ccache

      - name: Enable MSVC developer command prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake (Windows)
        run: .\scripts\github\windows\config_build.ps1

      - name: Build (Windows)
        run: .\scripts\github\windows\build.ps1

      - name: Upload Windows build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-artifact
          path: |
            build/tests/unit_tests.exe
            build/**/rosetta.exe
          if-no-files-found: error
          retention-days: 1


  # ----------------------------- Testing Windows -----------------------------

  test-win:
    runs-on: windows-latest
    timeout-minutes: 10
    needs: build-win

    steps:
      - uses: actions/checkout@v4

      - name: Download Windows test binary
        uses: actions/download-artifact@v4
        with:
          name: windows-build-artifact
          path: build/

      - name: Run Google Tests (Windows)
        run: .\scripts\github\windows\test.ps1


 # ----------------------------- LIT Regression Windows -----------------------------

  regression-tests-windows:
    runs-on: windows-latest
    timeout-minutes: 5
    needs: test-win

    steps:
      - uses: actions/checkout@v4

      - name: Add Git POSIX tools (make) to PATH
        shell: bash
        run: |
          echo "C:\Program Files\Git\usr\bin" >> "$GITHUB_PATH"

      - name: Install Lit and FileCheck
        run: |
          python -m pip install --no-warn-script-location lit filecheck

      - name: Download Windows build artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-build-artifact
          path: build-windows/

      - name: Locate and Setup Rosetta Binary
        shell: bash
        run: |
          echo "Locating rosetta.exe..."
          ROSETTA_BIN=$(find build-windows -type f -name "rosetta.exe" | head -n 1)

          if [ -z "$ROSETTA_BIN" ]; then
            echo "ERROR: rosetta.exe was not found."
            find build-windows -type f | sort
            exit 1
          fi

          echo "Found rosetta at: $ROSETTA_BIN"
          mkdir -p build/dev
          cp "$ROSETTA_BIN" build/dev/rosetta.exe

      - name: Run LIT Regression Suite
        shell: bash
        run: |
          lit -v scripts/Lit_Script