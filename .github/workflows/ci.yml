name: CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

# A new push on the same branch cancels the in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ----------------------------- Linting -----------------------------

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - uses: actions/checkout@v4

      - name: Run Linter
        run: bash ./scripts/github/linux/lint.sh


  # ----------------------------- Building Linux -----------------------------

  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-ccache

      - name: Configure CMake (Linux)
        run: bash ./scripts/github/linux/config_build.sh

      - name: Build (Linux)
        run: bash ./scripts/github/linux/build.sh

      - name: Upload Linux build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-build-artifact
          path: |
            build-linux/tests/unit_tests
            build-linux/**/rosetta
          if-no-files-found: error
          retention-days: 1


  # ----------------------------- Testing Linux -----------------------------

  test-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build-linux

    steps:
      - uses: actions/checkout@v4

      - name: Download Linux test binary
        uses: actions/download-artifact@v4
        with:
          name: linux-build-artifact
          path: build-linux/

      - name: Configure Test Environment (Linux)
        run: bash ./scripts/github/linux/config_test.sh

      - name: Run Google Tests (Linux)
        run: bash ./scripts/github/linux/test.sh


  # ----------------------------- LIT Regression Linux -----------------------------

  regression-tests-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test-linux

    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM, Lit and GCC
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm gcc python3-pip
          python3 -m pip install --user lit

      - name: Add LLVM tools to PATH
        run: |
          FILECHECK=$(find /usr/lib/llvm-* -type f -name FileCheck 2>/dev/null | head -n 1)

          if [ -z "$FILECHECK" ]; then
            echo "ERROR: FileCheck not found"
            exit 1
          fi

          echo "Found FileCheck: $FILECHECK"
          echo "$(dirname "$FILECHECK")" >> "$GITHUB_PATH"

      - name: Verify LIT and FileCheck
        run: |
          lit --version
          FileCheck --version
          gcc --version

      - name: Download Linux build artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-build-artifact
          path: build-linux/

      - name: Locate Rosetta
        run: |
          echo "Searching for Rosetta..."

          ROSETTA=$(find build-linux -type f -name rosetta | head -n 1)

          if [ -z "$ROSETTA" ]; then
            echo "ERROR: Rosetta executable was not found."
            echo "Artifact contents:"
            find build-linux -type f | sort
            exit 1
          fi

          echo "Found Rosetta at: $ROSETTA"

          mkdir -p build/dev
          cp "$ROSETTA" build/dev/rosetta
          chmod +x build/dev/rosetta

      - name: Verify Rosetta
        run: |
          test -x build/dev/rosetta
          ls -lh build/dev/rosetta
          file build/dev/rosetta

      - name: Run LIT Regression Suite
        run: lit -v scripts/Lit_Script


  # ----------------------------- Building Windows -----------------------------

  build-win:
    runs-on: windows-latest
    timeout-minutes: 20
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Enable MSVC developer command prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake (Windows)
        run: .\scripts\github\windows\config_build.ps1

      - name: Build (Windows)
        run: .\scripts\github\windows\build.ps1

      - name: Upload Windows build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-artifact
          path: |
            build/tests/unit_tests.exe
            build/**/rosetta.exe
          if-no-files-found: error
          retention-days: 1


  # ----------------------------- Testing Windows -----------------------------

  test-win:
    runs-on: windows-latest
    timeout-minutes: 10
    needs: build-win

    steps:
      - uses: actions/checkout@v4

      - name: Download Windows test binary
        uses: actions/download-artifact@v4
        with:
          name: windows-build-artifact
          path: build/

      - name: Run Google Tests (Windows)
        run: .\scripts\github\windows\test.ps1

  # ----------------------------- LIT Regression Windows -----------------------------

  regression-tests-win:
    runs-on: windows-latest
    timeout-minutes: 15
    needs: test-win

    steps:
      - uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Lit
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          python -m pip install lit


      - name: Download LLVM
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $llvmVersion = "23.1.0"
          $llvmUrl = "https://github.com/llvm/llvm-project/releases/download/llvmorg-$llvmVersion/clang+llvm-$llvmVersion-x86_64-pc-windows-msvc.tar.xz"
          $llvmArchive = "$env:RUNNER_TEMP\llvm.tar.xz"
          $llvmRoot = "$env:RUNNER_TEMP\llvm"

          Write-Host "Downloading LLVM $llvmVersion..."
          Write-Host "URL: $llvmUrl"

          Invoke-WebRequest `
            -Uri $llvmUrl `
            -OutFile $llvmArchive `
            -UseBasicParsing `
            -ErrorAction Stop

          if (-not (Test-Path $llvmArchive)) {
            Write-Error "LLVM archive was not downloaded."
            exit 1
          }

          Write-Host "LLVM archive downloaded successfully:"
          Get-Item $llvmArchive

          Write-Host "Extracting LLVM..."

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $llvmRoot |
            Out-Null

          # Windows 10/11 runners include tar.
          tar -xf $llvmArchive -C $llvmRoot

          Write-Host "LLVM archive extracted."

      - name: Locate LLVM FileCheck
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Searching for FileCheck.exe..."

          $fileCheck = Get-ChildItem `
            -Path "$env:RUNNER_TEMP\llvm" `
            -Filter "FileCheck.exe" `
            -Recurse `
            -File `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $fileCheck) {
            Write-Host "LLVM directory contents:"
            Get-ChildItem `
              -Path "$env:RUNNER_TEMP\llvm" `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object FullName

            Write-Error "FileCheck.exe was not found in the LLVM archive."
            exit 1
          }

          $llvmBin = $fileCheck.Directory.FullName

          Write-Host ""
          Write-Host "========================================"
          Write-Host "LLVM successfully located"
          Write-Host "========================================"
          Write-Host "LLVM bin:  $llvmBin"
          Write-Host "FileCheck: $($fileCheck.FullName)"
          Write-Host "========================================"

          # Make LLVM available to all following GitHub Actions steps.
          Add-Content `
            -Path $env:GITHUB_PATH `
            -Value $llvmBin

          # Make LLVM available immediately as well.
          $env:Path = "$llvmBin;$env:Path"


      - name: Verify LIT and FileCheck
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=== FileCheck location ==="
          Get-Command FileCheck -ErrorAction Stop |
            Select-Object Name, Source

          Write-Host ""
          Write-Host "=== FileCheck version ==="
          FileCheck --version

          Write-Host ""
          Write-Host "=== Lit version ==="
          lit --version

          Write-Host ""
          Write-Host "LLVM and Lit verified successfully."


      - name: Download Windows build artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-build-artifact
          path: build/

      - name: Locate Rosetta
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Searching for Rosetta..."

          $rosetta = Get-ChildItem `
            -Path build `
            -Recurse `
            -File `
            -ErrorAction SilentlyContinue |
            Where-Object {
              $_.Name -eq "rosetta.exe"
            } |
            Select-Object -First 1

          if (-not $rosetta) {
            Write-Host ""
            Write-Host "Artifact contents:"

            Get-ChildItem `
              -Path build `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object FullName

            Write-Error "Rosetta executable was not found."
            exit 1
          }

          Write-Host "Found Rosetta:"
          Write-Host $rosetta.FullName

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "build/dev" |
            Out-Null

          Copy-Item `
            -Path $rosetta.FullName `
            -Destination "build/dev/rosetta.exe" `
            -Force

      - name: Verify Rosetta
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $rosetta = "build/dev/rosetta.exe"

          if (-not (Test-Path $rosetta)) {
            Write-Error "$rosetta does not exist."
            exit 1
          }

          Write-Host "Rosetta verified:"
          Get-Item $rosetta


      - name: Run LIT Regression Suite
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Running Windows LIT regression suite..."

          lit -v scripts/Lit_Script