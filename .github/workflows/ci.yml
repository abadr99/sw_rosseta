name: CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Linter
        run: bash ./scripts/github/linter/cpplint.sh

  build-linux:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-ccache

      - name: Configure CMake (Linux)
        run: bash ./scripts/github/build_test/configure_linux.sh

      - name: Build (Linux)
        run: bash ./scripts/github/build_test/build_linux.sh

      - name: Upload Linux build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-build-artifact
          path: build-linux/

  test-linux:
    runs-on: ubuntu-latest
    needs: build-linux # This draws the line connecting the build and test rectangles
    steps:
      - uses: actions/checkout@v4

      - name: Download Linux build artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-build-artifact
          path: build-linux/

      - name: Configure Test Environment (Linux)
        run: bash ./scripts/github/build_test/Test_config_linux.sh

      - name: Run Google Tests (Linux)
        run: bash ./scripts/github/build_test/test_linux.sh

    regression-tests-linux:
    runs-on: ubuntu-latest
    needs: test-linux

    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM Lit & FileCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm gcc python3-pip
          python3 -m pip install --user lit

      - name: Add LLVM tools to PATH
        run: |
          FILECHECK=$(find /usr/lib/llvm-* -type f -name FileCheck 2>/dev/null | head -n 1)

          if [ -z "$FILECHECK" ]; then
            echo "ERROR: FileCheck not found"
            exit 1
          fi

          echo "Found FileCheck: $FILECHECK"
          echo "$(dirname "$FILECHECK")" >> "$GITHUB_PATH"

      - name: Download Linux build artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-build-artifact
          path: build-linux/

      - name: Locate Rosetta
        run: |
          echo "Artifact contents:"
          find build-linux -type f -o -type l | sort

          ROSETTA=$(find build-linux -type f -name rosetta | head -n 1)

          if [ -z "$ROSETTA" ]; then
            echo "ERROR: rosetta executable was not found in build artifact"
            exit 1
          fi

          echo "Found Rosetta at: $ROSETTA"

          mkdir -p build/dev
          cp "$ROSETTA" build/dev/rosetta
          chmod +x build/dev/rosetta

      - name: Verify tools and Rosetta
        run: |
          lit --version
          FileCheck --version
          gcc --version

          echo "Rosetta:"
          ls -lh build/dev/rosetta
          file build/dev/rosetta

      - name: Run LIT Regression Suite
        run: |
          lit -v scripts/Lit_Script

  build-win:
    runs-on: windows-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake (Windows)
        run: .\scripts\github\build_test\configure_windows.ps1

      - name: Run Windows Build Script
        run: .\scripts\github\build_test\build_windows.ps1
        
      - name: Upload Windows build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-artifact
          path: build/

  test-win:
    runs-on: windows-latest
    needs: build-win 
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows build artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-build-artifact
          path: build/

      - name: Run Google Tests (Windows)
        run: .\scripts\github\build_test\test_windows.ps1

    regression-tests-win:
    runs-on: windows-latest
    needs: test-win

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install LLVM and Lit
        shell: powershell
        run: |
          choco install llvm -y
          python -m pip install lit

      - name: Add LLVM to PATH
        shell: powershell
        run: |
          "C:\Program Files\LLVM\bin" |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify tools
        shell: powershell
        run: |
          lit --version
          FileCheck --version

      - name: Download Windows build artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-build-artifact
          path: build/

      - name: Find Rosetta executable
        shell: powershell
        run: |
          Write-Host "Searching downloaded artifact for Rosetta..."

          $rosetta = Get-ChildItem -Path build -Recurse -File |
            Where-Object {
              $_.Name -eq "rosetta.exe" -or $_.Name -eq "rosetta"
            } |
            Select-Object -First 1

          if (-not $rosetta) {
            Write-Host "Downloaded files:"
            Get-ChildItem -Path build -Recurse |
              Select-Object FullName

            Write-Error "Rosetta executable was not found."
            exit 1
          }

          Write-Host "Found Rosetta at:"
          Write-Host $rosetta.FullName

          New-Item -ItemType Directory -Force -Path "build/dev" | Out-Null

          Copy-Item `
            -Path $rosetta.FullName `
            -Destination "build/dev/rosetta.exe" `
            -Force

      - name: Verify Rosetta
        shell: powershell
        run: |
          if (-not (Test-Path "build/dev/rosetta.exe")) {
            Write-Error "build/dev/rosetta.exe does not exist."
            exit 1
          }

          Get-Item "build/dev/rosetta.exe"

      - name: Run LIT Regression Suite
        shell: powershell
        run: |
          lit -v scripts/Lit_Script