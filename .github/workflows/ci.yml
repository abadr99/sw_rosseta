name: CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

# A new push on the same branch cancels the in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ----------------------------- Linting -----------------------------

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - uses: actions/checkout@v4

      - name: Run Linter
        run: bash ./scripts/github/linux/lint.sh


  # ----------------------------- Building Linux -----------------------------

  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-ccache

      - name: Configure CMake (Linux)
        run: bash ./scripts/github/linux/config_build.sh

      - name: Build (Linux)
        run: bash ./scripts/github/linux/build.sh

      - name: Upload Linux build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-build-artifact
          path: |
            build-linux/tests/unit_tests
            build-linux/**/rosetta
          if-no-files-found: error
          retention-days: 1


  # ----------------------------- Testing Linux -----------------------------

  test-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build-linux

    steps:
      - uses: actions/checkout@v4

      - name: Download Linux test binary
        uses: actions/download-artifact@v4
        with:
          name: linux-build-artifact
          path: build-linux/

      - name: Configure Test Environment (Linux)
        run: bash ./scripts/github/linux/config_test.sh

      - name: Run Google Tests (Linux)
        run: bash ./scripts/github/linux/test.sh


  # ----------------------------- LIT Regression Linux -----------------------------

  regression-tests-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test-linux

    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM, Lit and GCC
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm gcc python3-pip
          python3 -m pip install --user lit

      - name: Add LLVM tools to PATH
        run: |
          FILECHECK=$(find /usr/lib/llvm-* -type f -name FileCheck 2>/dev/null | head -n 1)

          if [ -z "$FILECHECK" ]; then
            echo "ERROR: FileCheck not found"
            exit 1
          fi

          echo "Found FileCheck: $FILECHECK"
          echo "$(dirname "$FILECHECK")" >> "$GITHUB_PATH"

      - name: Verify LIT and FileCheck
        run: |
          lit --version
          FileCheck --version
          gcc --version

      - name: Download Linux build artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-build-artifact
          path: build-linux/

      - name: Locate Rosetta
        run: |
          echo "Searching for Rosetta..."

          ROSETTA=$(find build-linux -type f -name rosetta | head -n 1)

          if [ -z "$ROSETTA" ]; then
            echo "ERROR: Rosetta executable was not found."
            echo "Artifact contents:"
            find build-linux -type f | sort
            exit 1
          fi

          echo "Found Rosetta at: $ROSETTA"

          mkdir -p build/dev
          cp "$ROSETTA" build/dev/rosetta
          chmod +x build/dev/rosetta

      - name: Verify Rosetta
        run: |
          test -x build/dev/rosetta
          ls -lh build/dev/rosetta
          file build/dev/rosetta

      - name: Run LIT Regression Suite
        run: lit -v scripts/Lit_Script


  # ----------------------------- Building Windows -----------------------------

  build-win:
    runs-on: windows-latest
    timeout-minutes: 20
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Enable MSVC developer command prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake (Windows)
        run: .\scripts\github\windows\config_build.ps1

      - name: Build (Windows)
        run: .\scripts\github\windows\build.ps1

      - name: Upload Windows build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-artifact
          path: |
            build/tests/unit_tests.exe
            build/**/rosetta.exe
          if-no-files-found: error
          retention-days: 1


  # ----------------------------- Testing Windows -----------------------------

  test-win:
    runs-on: windows-latest
    timeout-minutes: 10
    needs: build-win

    steps:
      - uses: actions/checkout@v4

      - name: Download Windows test binary
        uses: actions/download-artifact@v4
        with:
          name: windows-build-artifact
          path: build/

      - name: Run Google Tests (Windows)
        run: .\scripts\github\windows\test.ps1

  # ----------------------------- LIT Regression Windows -----------------------------

  regression-tests-win:
    runs-on: windows-latest
    timeout-minutes: 15
    needs: test-win

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Lit
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install lit

      - name: Install LLVM and Clang
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Installing LLVM via Chocolatey..."
          choco install llvm --version=17.0.6 -y --no-progress

          if ($LASTEXITCODE -ne 0) {
            Write-Error "LLVM installation failed."
            exit $LASTEXITCODE
          }

          $fileCheck = "C:\Program Files\LLVM\bin\FileCheck.exe"

          if (-not (Test-Path $fileCheck)) {
            Write-Host "FileCheck not found at expected location."
            Write-Host "Searching for FileCheck.exe..."

            $found = Get-ChildItem `
              -Path "C:\Program Files" `
              -Filter "FileCheck.exe" `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1

            if (-not $found) {
              Write-Error "FileCheck.exe was not found."
              exit 1
            }

            $fileCheck = $found.FullName
          }

          Write-Host "FileCheck found at:"
          Write-Host $fileCheck

      - name: Add LLVM to PATH
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $llvmBin = "C:\Program Files\LLVM\bin"

          if (-not (Test-Path "$llvmBin\FileCheck.exe")) {
            Write-Error "LLVM bin directory does not contain FileCheck.exe."
            exit 1
          }

          Write-Host "Adding LLVM to PATH:"
          Write-Host $llvmBin

          Add-Content -Path $env:GITHUB_PATH -Value $llvmBin

          # Make available in this step as well.
          $env:Path = "$llvmBin;$env:Path"

      - name: Verify LIT and FileCheck
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=== Verifying installations ==="

          Write-Host "`n1. FileCheck location:"
          Get-Command FileCheck -ErrorAction Stop |
            Select-Object Source

          Write-Host "`n2. FileCheck version:"
          FileCheck --version

          Write-Host "`n3. Lit version:"
          lit --version

          Write-Host "`nAll tools verified successfully!"

      - name: Download Windows build artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-build-artifact
          path: build/

      - name: Locate Rosetta
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Searching for Rosetta..."

          $rosetta = Get-ChildItem `
            -Path build `
            -Recurse `
            -File `
            -ErrorAction SilentlyContinue |
            Where-Object {
              $_.Name -eq "rosetta.exe"
            } |
            Select-Object -First 1

          if (-not $rosetta) {
            Write-Host "Artifact contents:"
            Get-ChildItem -Path build -Recurse |
              Select-Object FullName

            Write-Error "Rosetta executable was not found."
            exit 1
          }

          Write-Host "Found Rosetta:"
          Write-Host $rosetta.FullName

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "build/dev" |
            Out-Null

          Copy-Item `
            -Path $rosetta.FullName `
            -Destination "build/dev/rosetta.exe" `
            -Force

      - name: Verify Rosetta
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          if (-not (Test-Path "build/dev/rosetta.exe")) {
            Write-Error "build/dev/rosetta.exe does not exist."
            exit 1
          }

          Get-Item "build/dev/rosetta.exe"

      - name: Run LIT Regression Suite
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          lit -v scripts/Lit_Script