name: CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  Linter-Test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install cpplint
        run: pip install cpplint

      - name: Run Linter
        run: python ./scripts/cpplint.py --recursive ./dev ./tests

  Build-Test-Linux:
    runs-on: ubuntu-latest
    needs: Linter-Test
    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake (Linux)
        run: cmake -S . -B build-linux

      - name: Build (Linux)
        run: cmake --build build-linux

      - name: Upload Linux build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-build-artifact
          path: build-linux/
